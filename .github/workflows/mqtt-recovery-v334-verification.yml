name: Verify MQTT recovery merge of v3.34.0
on:
  push:
    branches: [mqtt-recovery-v334-validation]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Merge exact upstream release
        id: merge
        run: |
          git config user.name pponce
          git config user.email pponce@users.noreply.github.com
          git ls-files '*.md' > "$RUNNER_TEMP/markdown-before.txt"
          set +e
          git merge --no-ff --no-commit 3533a97d9d369901667e8e05a0d1c4bd1a3ffee3 > "$RUNNER_TEMP/merge.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/merge.log"
          echo "summary=$(tail -c 1500 "$RUNNER_TEMP/merge.log" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          test "$result" -eq 0
      - name: "Merge result: ${{ steps.merge.outputs.summary }}"
        if: always()
        run: echo "Merge result recorded above."
      - run: npm ci
      - name: Format validation workflow only
        run: npx prettier --write .github/workflows/mqtt-recovery-v334-verification.yml .github/workflows/build-and-commit-dist.yml
      - name: Formatting
        id: formatting
        continue-on-error: true
        run: npm run lint > "$RUNNER_TEMP/lint.log" 2>&1
      - name: Types
        id: types
        continue-on-error: true
        run: npm run typecheck > "$RUNNER_TEMP/types.log" 2>&1
      - name: Full tests
        id: tests
        continue-on-error: true
        run: npm test -- --runInBand --json --outputFile="$RUNNER_TEMP/tests.json" > "$RUNNER_TEMP/tests.log" 2>&1
      - name: Build installable files
        id: build
        continue-on-error: true
        run: npm run build > "$RUNNER_TEMP/build.log" 2>&1
      - name: Verify preserved files and package
        id: preserve
        run: |
          node -e 'const fs=require("fs");const files=fs.readFileSync(process.env.RUNNER_TEMP+"/markdown-before.txt","utf8").trim().split("\n");for(const p of files){if(!fs.existsSync(p))throw Error("Missing "+p)}if(require("./package.json").version!=="3.34.0")throw Error("Wrong version");if(!fs.existsSync("dist/index.js"))throw Error("Missing entrypoint");console.log("Preserved",files.length,"Markdown files; version and compiled entrypoint verified.");'
          git diff --check
          git diff --stat -- dist
      - name: Require all checks
        id: gate
        if: always()
        run: |
          test "${{ steps.merge.outcome }}" = success
          test "${{ steps.formatting.outcome }}" = success
          test "${{ steps.types.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.preserve.outcome }}" = success
      - name: Commit validated merge and compiled files
        if: steps.gate.outcome == 'success'
        run: |
          git add -f dist
          git commit -m "Validate v3.34.0 merge with rebuilt dist [skip ci]"
          git push
      - name: Publish bounded evidence
        if: always()
        id: evidence
        run: |
          set +e
          (
            set -e
            if git rev-parse -q --verify MERGE_HEAD; then git merge --abort; fi
            mkdir -p validation-evidence-v334
            for kind in merge lint types build; do
              if [ -f "$RUNNER_TEMP/$kind.log" ]; then tail -n 100 "$RUNNER_TEMP/$kind.log" > "validation-evidence-v334/$kind.txt"; fi
            done
            if [ -f "$RUNNER_TEMP/tests.json" ]; then
              node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1]));fs.writeFileSync(process.argv[2],JSON.stringify({passed:r.numPassedTests,failed:r.numFailedTests,suites:r.numTotalTestSuites,runtimeErrors:r.numRuntimeErrorTestSuites,failures:r.testResults.filter(s=>s.status==="failed").map(s=>({name:s.name,message:s.message}))},null,2)+"\n");' "$RUNNER_TEMP/tests.json" validation-evidence-v334/tests.json
            fi
            git add -f validation-evidence-v334
            git commit -m "Record recovery merge validation evidence [skip ci]"
            git push
          ) > "$RUNNER_TEMP/evidence.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/evidence.log"
          echo "summary=$(tail -c 1000 "$RUNNER_TEMP/evidence.log" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          test "$result" -eq 0
      - name: "Evidence result: ${{ steps.evidence.outputs.summary }}"
        if: always()
        run: echo "Evidence result recorded above."
