name: Build isolated v3.39.0 live-test installs
on:
  push:
    branches: ["review-v339/validation"]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 37
            sha: b4e9342fcfff73c7ca3897bf48509fdfbd241d6f
            branch: test-pr37-v339
          - pr: 38
            sha: 5ae9c12f1e0fdc26e609bfa7a02f47f17bcd58be
            branch: test-pr38-v339
          - pr: 39
            sha: b7986ee090b0b1dc92913f34c8bd4ff34134047f
            branch: test-pr39-v339
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit installable build output
        run: |
          test -s dist/index.js
          git config user.name pponce
          git config user.email 8853118+pponce@users.noreply.github.com
          git add -f dist
          git commit -m "Build isolated PR #${{ matrix.pr }} for live Homebridge checks"
          git diff --name-only HEAD^ HEAD | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{if(s.trim().split("\n").some(p=>!p.startsWith("dist/")))process.exit(1)})'
          git push origin HEAD:refs/heads/${{ matrix.branch }}
