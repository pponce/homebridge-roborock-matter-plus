name: Verify PR1 MQTT reconnect review
on:
  push:
    branches: [mqtt-pr1-v336-validation]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format candidate
        id: prepare
        run: |
          npx prettier --write __tests__/mqtt-session*.test.js roborockLib/lib/mqttSessionDiagnostics.js roborockLib/lib/roborock_mqtt_connector.js roborockLib/lib/messageQueueHandler.js docs/mqtt-session-diagnostics.md
          git add -u
          if ! git diff --cached --quiet; then
            git -c user.name="pponce" -c user.email="pponce@users.noreply.github.com" commit -m "Format MQTT reconnect review candidate [skip ci]"
          fi
          git push origin HEAD:refs/heads/mqtt-pr1-v336-verified
      - name: Prove both regressions on merged sources before the fix
        id: baseline
        continue-on-error: true
        run: |
          for file in mqttSessionDiagnostics.js roborock_mqtt_connector.js messageQueueHandler.js; do
            cp "roborockLib/lib/$file" "$RUNNER_TEMP/$file"
            git show 2d834702e9d592da5ce6cd5bd9975419e20d82fb:roborockLib/lib/$file > "roborockLib/lib/$file"
          done
          set +e
          npm test -- --runInBand __tests__/mqtt-session-observations.test.js __tests__/mqtt-session-real-reconnect.test.js --testNamePattern="real mqtt.js automatic reconnect|a disconnected request timeout" --json --outputFile="$RUNNER_TEMP/baseline.json" > "$RUNNER_TEMP/baseline.log" 2>&1
          result=$?
          set -e
          for file in mqttSessionDiagnostics.js roborock_mqtt_connector.js messageQueueHandler.js; do cp "$RUNNER_TEMP/$file" "roborockLib/lib/$file"; done
          test "$result" -ne 0
          node -e 'const r=require(process.argv[1]);if(r.numFailedTests!==2 || r.numRuntimeErrorTestSuites!==0)process.exit(1);const f=r.testResults.flatMap(s=>s.assertionResults).filter(t=>t.status==="failed");if(!f.some(t=>t.fullName.includes("real mqtt.js")&&t.failureMessages.join(" ").includes("subscriptionAcknowledged"))||!f.some(t=>t.fullName.includes("disconnected request")&&t.failureMessages.join(" ").includes("subscription not acknowledged")))process.exit(1)' "$RUNNER_TEMP/baseline.json"
      - name: Formatting
        id: lint
        continue-on-error: true
        run: npm run lint > "$RUNNER_TEMP/lint.log" 2>&1
      - name: Type checks
        id: types
        continue-on-error: true
        run: npm run typecheck > "$RUNNER_TEMP/types.log" 2>&1
      - name: Full tests
        id: tests
        continue-on-error: true
        run: npm test -- --runInBand --json --outputFile="$RUNNER_TEMP/tests.json" > "$RUNNER_TEMP/tests.log" 2>&1
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build > "$RUNNER_TEMP/build.log" 2>&1
      - name: Save evidence
        id: evidence
        if: always()
        run: |
          mkdir -p validation-evidence
          for kind in baseline tests; do
            if [ -f "$RUNNER_TEMP/$kind.json" ]; then
              node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1]));fs.writeFileSync(process.argv[2],JSON.stringify({passed:r.numPassedTests,failed:r.numFailedTests,runtimeErrors:r.numRuntimeErrorTestSuites,suites:r.numTotalTestSuites,failures:r.testResults.flatMap(s=>(s.assertionResults||[]).filter(t=>t.status==="failed").map(t=>({name:t.fullName,messages:t.failureMessages}))),suiteErrors:r.testResults.filter(s=>s.message&&!s.assertionResults?.length).map(s=>s.message)},null,2)+"\n");' "$RUNNER_TEMP/$kind.json" "validation-evidence/$kind.json"
            fi
          done
          for kind in lint types build baseline tests; do
            if [ -f "$RUNNER_TEMP/$kind.log" ]; then tail -n 100 "$RUNNER_TEMP/$kind.log" > "validation-evidence/$kind.txt"; fi
          done
          git add -f validation-evidence
          git -c user.name="pponce" -c user.email="pponce@users.noreply.github.com" commit -m "Record reconnect review validation evidence [skip ci]"
          git push origin HEAD:refs/heads/mqtt-pr1-v336-verified
      - name: Require all gates
        if: always()
        run: |
          test "${{ steps.prepare.outcome }}" = success
          test "${{ steps.baseline.outcome }}" = success
          test "${{ steps.lint.outcome }}" = success
          test "${{ steps.types.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.evidence.outcome }}" = success
