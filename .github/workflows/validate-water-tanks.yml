name: Validate refill-dock water warnings

on:
  push:
    branches:
      - review-delay/water-tanks-combined
      - review-delay/water-tanks-minimal
    paths-ignore:
      - .validation/**

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format, build and test
        run: python3 .github/scripts/validate-water-tanks.py
      - name: Commit validation evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/matter_vacuum_accessory.ts docs/water-tank-warnings.md __tests__
          git add -f dist .validation/water-tanks.json
          git diff --cached --quiet || git commit -m 'Build and record refill-dock warning validation'
          git push origin HEAD:"$GITHUB_REF_NAME"
