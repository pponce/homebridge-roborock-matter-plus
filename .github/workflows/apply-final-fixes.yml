          restore = '''  private restoreExistingScheduleServices(): boolean {
    const restored: RoborockSchedule[] = [];

    for (const service of this.managerAccessory.services) {
      if (service.UUID !== this.platform.Service.Switch.UUID) {
        continue;
      }

      const subtype = (service as { subtype?: string }).subtype;
      if (!subtype?.startsWith(SERVICE_PREFIX)) {
        continue;
      }

      let scheduleId: string;
      try {
        scheduleId = decodeURIComponent(subtype.slice(SERVICE_PREFIX.length));
      } catch {
        continue;
      }

      if (!scheduleId) {
        continue;
      }

      const enabled = Boolean(
        service.getCharacteristic(this.platform.Characteristic.On).value
      );

      restored.push({
        id: scheduleId,
        enabled,
        timer: [scheduleId, enabled ? "on" : "off"],
      });
    }

    if (restored.length === 0) {
      return false;
    }

    restored.sort((a, b) =>
      a.id.localeCompare(b.id, undefined, { numeric: true })
    );
    this.sync(restored);
    return this.scheduleAccessories.size > 0;
  }

