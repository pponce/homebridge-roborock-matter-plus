    minimumRefreshStartedAt = 0
  ): Promise<RoborockScheduleRefreshResult> {
    if (this.disposed) {
      return {
        success: false,
        hasSchedules: false,
      };
    }

    if (
      this.refreshInProgress &&
      this.refreshStartedAt >= minimumRefreshStartedAt
    ) {
      return this.refreshInProgress;
    }

    const refreshStartedAt = Date.now();
    this.refreshStartedAt = refreshStartedAt;
    this.lastRefreshStartedAt = refreshStartedAt;

    const refreshPromise = this.performRefresh(refreshStartedAt);
    this.refreshInProgress = refreshPromise;
    try {
      return await refreshPromise;
    } finally {
      if (this.refreshInProgress === refreshPromise) {
        this.refreshInProgress = undefined;
      }
    }
  }

