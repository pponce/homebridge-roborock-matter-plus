                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {occurrences} for:\n{old}")
              if occurrences == 0:
                  raise SystemExit(f"{path}: target text not found:\n{old}")
              p.write_text(text.replace(old, new, count if count is not None else -1))

