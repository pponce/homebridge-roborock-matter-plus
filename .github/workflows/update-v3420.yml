name: Update and validate v3.42.0
on:
  push:
    branches: ["validation/v3420-full-r3"]
permissions:
  contents: write
jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        include: [{"branch":"SCHEDULE_PAUSE_DELAY","expected":"eefcec1fa61d79cdc2a94330226404997a4f44fa","mode":"home","label":"full-r3"}]
    runs-on: ubuntu-latest
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.expected }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Integrate, validate, and publish
        env:
          TARGET: ${{ matrix.branch }}
          EXPECTED: ${{ matrix.expected }}
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          exec > >(tee "$RUNNER_TEMP/validation.txt") 2>&1
          git config user.name pponce
          git config user.email pponce@users.noreply.github.com
          git fetch https://github.com/mathiashornbek/homebridge-roborock-matter.git refs/tags/v3.42.0
          release=$(git rev-parse FETCH_HEAD^{commit})
          test "$release" = "9b7dafae4416dcb0ffa921b90d30641567ddb1bf"
          if [ "$MODE" = pr ]; then
            git rebase --onto "$release" "$(git merge-base HEAD "$release")"
          else
            if ! git merge --no-edit "$release"; then
              python3 -c 'exec("import pathlib,re,subprocess\npaths=subprocess.check_output([\"git\",\"diff\",\"--name-only\",\"--diff-filter=U\"],text=True).splitlines()\nexpected={\"__tests__/matter-vacuum.test.js\",\"__tests__/ordinary-mqtt-readiness.test.js\",\"docs/mqtt-send-readiness.md\",\"roborockLib/lib/messageQueueHandler.js\",\"roborockLib/lib/roborock_mqtt_connector.js\",\"roborockLib/roborockAPI.js\",\"src/matter_vacuum_accessory.ts\"}\nassert set(paths)==expected, paths\nfor name in paths:\n p=pathlib.Path(name); s=p.read_text(); s=re.sub(r\"^<<<<<<<[^\\n]*\\n(.*?)^=======\\n.*?^>>>>>>>[^\\n]*\\n\",lambda m:m.group(1),s,flags=re.M|re.S); assert \"<<<<<<<\" not in s; p.write_text(s); subprocess.run([\"git\",\"add\",name],check=True)")'
              git commit -m "Integrate v3.42.0 while retaining optional recovery and schedule controls"
            fi
          fi
          git merge-base --is-ancestor "$release" HEAD
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npm test -- --runInBand
          if [ "$MODE" = home ]; then
            node --test tests/*.test.cjs
            if [ "$TARGET" = SCHEDULE_PAUSE_DELAY ]; then
              python3 -m unittest discover -s tests -p 'test_*.py'
            fi
            git add -f dist
            if ! git diff --cached --quiet; then git commit -m "Rebuild compiled files for v3.42.0"; fi
            test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$EXPECTED"
            git push origin "HEAD:refs/heads/$TARGET"
          else
            git push --force-with-lease="refs/heads/$TARGET:$EXPECTED" origin "HEAD:refs/heads/$TARGET"
          fi
          echo "PUBLISHED $(git rev-parse HEAD)"
      - name: Publish validation report
        if: always()
        env:
          LABEL: ${{ matrix.label }}
        shell: bash
        run: |
          git config user.name pponce
          git config user.email pponce@users.noreply.github.com
          git diff --cc >> "$RUNNER_TEMP/validation.txt"
          blob=$(git hash-object -w "$RUNNER_TEMP/validation.txt")
          tree=$(printf "100644 blob %s\tvalidation.txt\n" "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Validation report for $LABEL")
          git push origin "$commit:refs/heads/validation/v3420-report-$LABEL"
