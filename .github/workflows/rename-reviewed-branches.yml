name: Label reviewed deletion candidates

on:
  push:
    branches: [review-delay/branch-cleanup-20261025]
    paths:
      - .validation/branch-rename-manifest.json

permissions:
  contents: write
  pull-requests: read

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Recheck and rename the reviewed branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/rename-reviewed-branches.py
      - name: Save rename results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .validation/branch-rename-results.json
          git diff --cached --quiet || git commit -m 'Record branch deletion-label results'
          git push origin HEAD:"$GITHUB_REF_NAME"
