name: "Build and commit dist"

on:
  push:
    branches-ignore:
      - main
      - "review-delay/**"
    paths-ignore:
      - "dist/**"

permissions:
  contents: write

concurrency:
  group: "build-dist-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-and-commit:
    name: "Test, build, and commit dist"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format capture changes with the pinned toolchain
        run: ./node_modules/.bin/prettier --write config.schema.json homebridge-ui/public/index.html homebridge-ui/public/index.js roborockLib/roborockAPI.js src/platform.ts src/types.ts src/ui/index.ts roborockLib/lib/scheduleProtocolCapture.js tests/schedule-protocol-capture.test.cjs docs/local-server-schedule-capture.md

      - name: Check formatting
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand
        env:
          CI: true

      - name: Run Node diagnostic tests
        run: node --test tests/*.test.cjs

      - name: Run Python diagnostic tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Commit generated dist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist
          git add config.schema.json homebridge-ui/public/index.html homebridge-ui/public/index.js roborockLib/roborockAPI.js src/platform.ts src/types.ts src/ui/index.ts roborockLib/lib/scheduleProtocolCapture.js tests/schedule-protocol-capture.test.cjs docs/local-server-schedule-capture.md

          if git diff --cached --quiet; then
            echo "dist is already up to date."
            exit 0
          fi

          git commit -m "Format and build schedule capture diagnostics"
          git push
