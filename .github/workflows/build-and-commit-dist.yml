name: "Build and commit dist"

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "dist/**"

permissions:
  contents: write

concurrency:
  group: "build-dist-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-and-commit:
    name: "Test, build, and commit dist"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand
        env:
          CI: true

      - name: Build
        run: npm run build

      - name: Commit generated dist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist

          if git diff --cached --quiet -- dist; then
            echo "dist is already up to date."
            exit 0
          fi

          git commit -m "Build dist from source"
          git push
