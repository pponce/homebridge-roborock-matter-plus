name: Verified cache build output
on:
  push:
    branches: [verify/schedule-cache-plus]
permissions:
  contents: read
  checks: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Report compiled module
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const zlib = require('zlib');
            const crypto = require('crypto');
            const files = ['dist/hap_schedule_accessory.js','dist/hap_schedule_accessory.js.map'].map(path => {
              const content = fs.readFileSync(path, 'utf8');
              return {path,content,sha256:crypto.createHash('sha256').update(content).digest('hex')};
            });
            const payload = zlib.gzipSync(Buffer.from(JSON.stringify(files))).toString('base64');
            if (payload.length > 60000) throw new Error('Build output exceeds report size');
            await github.rest.checks.create({
              owner:context.repo.owner,repo:context.repo.repo,name:'Compiled cache module',
              head_sha:context.sha,status:'completed',conclusion:'success',
              output:{title:'Compiled cache module and source map',summary:'gzip+base64 JSON build output with SHA-256 checksums.',text:payload}
            });
